# Supabase CLI configuration for local development (`supabase start`). Requires Docker.
project_id = "solotrav"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3001", "solotrav://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
minimum_password_length = 8

# Google sign-in: create OAuth clients in Google Cloud, then set these via environment variables (never commit them).
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_OAUTH_WEB_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "100MiB"

[realtime]
enabled = true
