name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + database security tests (in-process Postgres, no Docker)
        run: npm test
      - name: Build web and admin
        run: |
          npm run build -w @solotrav/web
          npm run build -w @solotrav/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Bundle the Android JavaScript (verifies the app compiles; does not build an APK)
        run: npx expo export --platform android --output-dir /tmp/android-export
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
